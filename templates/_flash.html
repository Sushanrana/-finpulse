{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-stack" data-testid="flash-messages">
      {% for category, message in messages %}
        <div class="flash flash-{{ category if category in ['success','error','info','warning'] else 'info' }}" role="status" data-testid="flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
