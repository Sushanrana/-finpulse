{% macro icon(name, size=18) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'dashboard' -%}<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{%- elif name == 'transactions' -%}<path d="M7 7h13l-3-3"/><path d="M17 17H4l3 3"/>
{%- elif name == 'goals' -%}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>
{%- elif name == 'health' -%}<path d="M3 12h4l2-5 4 10 2-5h6"/>
{%- elif name == 'insights' -%}<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/>
{%- elif name == 'time' -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'logout' -%}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
{%- elif name == 'menu' -%}<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'upload' -%}<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 20h16"/>
{%- elif name == 'trash' -%}<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>
{%- elif name == 'plus' -%}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'shield' -%}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == 'lock' -%}<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == 'download' -%}<path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/>
{%- elif name == 'arrow' -%}<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
{%- else -%}<circle cx="12" cy="12" r="9"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro csrf() -%}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{%- endmacro %}
